<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KILLBOT · Cluedo espacial</title>
<meta name="description" content="KILLBOT: el cluedo espacial de FuturMovil. Descubre qué robot desconectó a Lucas.">
<meta name="theme-color" content="#04050d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KILLBOT">
<meta property="og:title" content="KILLBOT · Cluedo espacial">
<meta property="og:description" content="¿Qué robot desconectó a Lucas? Juega con tus amigos en la TV o solo con móviles.">
<meta property="og:image" content="https://puntofibra.github.io/killbot/icon512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon192.png?v=2">
<link rel="apple-touch-icon" href="appletouch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050d; --panel:rgba(14,20,40,.72); --line:rgba(120,200,255,.18);
  --neon:#22e4ff; --pink:#ff3bd4; --lucas:#17ff5f; --red:#ff3b5c; --gold:#ffd23f;
  --txt:#e9f4ff; --mut:#8aa0bf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(1200px 700px at 15% 10%,rgba(80,40,160,.35),transparent 60%),radial-gradient(900px 600px at 90% 90%,rgba(0,140,200,.25),transparent 60%),var(--bg)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:fixed;inset:0;z-index:1;overflow:auto}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit}
img{-webkit-user-drag:none}
.emo{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.hidden{display:none!important}

/* ── botones ── */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px 18px;border-radius:16px;
  font-family:Orbitron;font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,rgba(34,228,255,.22),rgba(255,59,212,.18));border:1px solid rgba(34,228,255,.55);
  box-shadow:0 0 18px rgba(34,228,255,.25),inset 0 0 18px rgba(34,228,255,.12);overflow:hidden;transition:transform .12s,box-shadow .2s}
.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.5s infinite}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{padding:20px;font-size:18px}
.btn.green{background:linear-gradient(135deg,rgba(23,255,95,.35),rgba(0,160,90,.25));border-color:var(--lucas);box-shadow:0 0 22px rgba(23,255,95,.35)}
.btn.red{background:linear-gradient(135deg,rgba(255,59,92,.4),rgba(160,0,60,.3));border-color:var(--red);box-shadow:0 0 22px rgba(255,59,92,.35)}
.btn.gold{background:linear-gradient(135deg,rgba(255,210,63,.4),rgba(200,120,0,.25));border-color:var(--gold);box-shadow:0 0 22px rgba(255,210,63,.3)}
.btn.ghost{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.18);box-shadow:none}
.btn.sm{padding:10px 12px;font-size:12px;border-radius:12px;width:auto}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.row{display:flex;gap:10px}
.row>*{flex:1}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.inp{width:100%;padding:15px 16px;border-radius:14px;border:1px solid rgba(34,228,255,.4);background:rgba(0,10,30,.6);color:#fff;font-size:20px;font-weight:700;outline:none;text-align:center;letter-spacing:1px}
.inp:focus{box-shadow:0 0 0 3px rgba(34,228,255,.25)}
.inp.code{font-family:Orbitron;font-size:34px;letter-spacing:12px;text-transform:uppercase}
.lbl{font-family:Orbitron;font-size:11px;letter-spacing:3px;color:var(--mut);text-transform:uppercase;margin:4px 0 8px}
h2.t{font-family:Orbitron;font-weight:900;letter-spacing:2px;margin:0 0 14px;font-size:22px;text-transform:uppercase;
  background:linear-gradient(90deg,#fff,var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── menú ── */
.screen{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.menu{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.logo{position:relative;text-align:center;margin-bottom:4px}
.logo img.lg{width:100%;max-width:400px}
.logoTxt{font-family:Orbitron;font-weight:900;font-size:clamp(46px,14vw,78px);letter-spacing:4px;line-height:1;color:#fff;
  text-shadow:0 0 8px var(--neon),0 0 26px var(--neon),0 0 60px rgba(255,59,212,.6);position:relative;display:inline-block;animation:flick 6s infinite}
.logoTxt:before,.logoTxt:after{content:attr(data-t);position:absolute;inset:0}
.logoTxt:before{color:var(--pink);clip-path:polygon(0 0,100% 0,100% 40%,0 40%);transform:translate(-3px);animation:glitch 2.8s infinite steps(2)}
.logoTxt:after{color:var(--neon);clip-path:polygon(0 60%,100% 60%,100% 100%,0 100%);transform:translate(3px);animation:glitch 3.3s infinite steps(2) reverse}
@keyframes glitch{0%,88%{transform:none;opacity:0}90%{transform:translate(-5px,1px);opacity:.9}94%{transform:translate(4px,-1px);opacity:.9}100%{opacity:0}}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.4}98%{opacity:1}99%{opacity:.6}}
.sub{font-family:Orbitron;letter-spacing:5px;font-size:11px;color:var(--lucas);text-shadow:0 0 10px var(--lucas);margin-top:6px}
.hero{position:relative;height:190px;display:flex;justify-content:center;align-items:flex-end;margin:4px 0 6px}
.hero img{height:180px;filter:drop-shadow(0 0 18px rgba(23,255,95,.35));animation:float 4s ease-in-out infinite}
.hero .emo{font-size:120px}
.hero:after{content:"";position:absolute;bottom:-4px;width:180px;height:18px;border-radius:50%;background:radial-gradient(rgba(23,255,95,.45),transparent 70%);filter:blur(4px)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:6px;letter-spacing:1px}

/* ── selector de personajes ── */
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ch{position:relative;border-radius:16px;padding:6px 4px 8px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.25));border:2px solid rgba(255,255,255,.08);text-align:center;transition:.2s;overflow:hidden}
.ch img,.ch .emo{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.ch .nm{font-family:Orbitron;font-size:9.5px;font-weight:700;letter-spacing:.5px;color:var(--c);text-shadow:0 0 8px var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .ow{font-size:11px;color:#fff;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.ch:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,var(--c),transparent 65%);opacity:.18}
.ch.mine{border-color:var(--c);box-shadow:0 0 18px var(--c),inset 0 0 18px var(--c);transform:translateY(-2px)}
.ch.taken{opacity:.42;filter:grayscale(.7)}
.ch .dot{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}

/* ── lobby ── */
.lobby{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
.codeBox{display:flex;gap:14px;align-items:center;padding:14px}
.qr{background:#fff;padding:8px;border-radius:14px;flex:none;box-shadow:0 0 24px rgba(34,228,255,.35)}
.qr img,.qr canvas{display:block}
.bigCode{font-family:Orbitron;font-weight:900;font-size:42px;letter-spacing:8px;color:#fff;text-shadow:0 0 14px var(--neon)}
.plist{display:flex;flex-direction:column;gap:7px}
.pl{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:14px;background:rgba(255,255,255,.04);border-left:4px solid var(--c)}
.pl img,.pl .emo{width:38px;height:38px;object-fit:contain;font-size:26px}
.pl .n{flex:1;font-weight:700;font-size:17px}
.pl .tag{font-size:11px;font-family:Orbitron;color:var(--mut);letter-spacing:1px}
.x{background:rgba(255,59,92,.18);border:1px solid rgba(255,59,92,.5);border-radius:10px;width:32px;height:32px;font-weight:900}

/* TV lobby */
.tvLobby{width:100%;height:100%;display:grid;grid-template-columns:minmax(320px,38%) 1fr;gap:3vw;padding:4vh 4vw;align-items:center}
.tvLobby .left{display:flex;flex-direction:column;align-items:center;gap:2.2vh;text-align:center}
.tvLobby .qr{padding:1.2vh;border-radius:2vh}
.tvLobby .bigCode{font-size:9vh;letter-spacing:2vh}
.tvLobby .hint{font-size:2.4vh;color:var(--mut)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vh}
.slot{border-radius:2.2vh;padding:1.2vh;text-align:center;min-height:22vh;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.25));border:2px solid rgba(255,255,255,.08);position:relative;overflow:hidden}
.slot img,.slot .emo{height:15vh;max-width:100%;object-fit:contain;font-size:10vh}
.slot .nm{font-family:Orbitron;font-weight:700;font-size:1.8vh;color:var(--c);text-shadow:0 0 10px var(--c)}
.slot .ow{font-size:2.4vh;font-weight:700}
.slot.on{border-color:var(--c);box-shadow:0 0 2vh var(--c);animation:pop .5s}
.slot.off{opacity:.25;filter:grayscale(1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:none;opacity:1}}

/* ── juego ── */
.game{position:fixed;inset:0;display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:100%;
  padding:max(8px,env(safe-area-inset-top)) 8px max(6px,env(safe-area-inset-bottom))}
.gbar{display:flex;align-items:center;gap:8px;padding:4px 4px 8px}
.gbar .cd{font-family:Orbitron;font-size:11px;letter-spacing:2px;color:var(--mut);padding:6px 9px;border:1px solid var(--line);border-radius:10px}
.turnB{flex:1;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent),transparent);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);min-width:0}
.turnB img,.turnB .emo{width:30px;height:30px;object-fit:contain;font-size:22px}
.turnB b{font-family:Orbitron;font-size:12.5px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.turnB small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:17px;flex:none}
.boardWrap{display:flex;justify-content:center}

.board{position:relative;width:min(96vw,50vh);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(20,40,80,.55) 0,rgba(10,15,35,.75) 55%,rgba(0,0,0,0) 72%)}
.board:before{content:"";position:absolute;inset:3%;border-radius:50%;border:1px dashed rgba(34,228,255,.18);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.board svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lines .ringL{fill:none;stroke:rgba(34,228,255,.35);stroke-width:1.3;stroke-dasharray:2 1.5;animation:dash 6s linear infinite}
.lines .tele{fill:none;stroke-width:.7;stroke-dasharray:1.2 1.2;animation:dash 2s linear infinite;opacity:.65}
.lines .spoke{stroke:rgba(255,255,255,.07);stroke-width:.5}
@keyframes dash{to{stroke-dashoffset:-20}}
.room,.core{position:absolute;transform:translate(-50%,-50%);border-radius:22%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--rc) 35%,#0b1328),#070b18 75%);
  border:1.5px solid color-mix(in srgb,var(--rc) 70%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--rc) 40%,transparent),inset 0 0 12px rgba(0,0,0,.6);transition:box-shadow .3s,transform .3s}
.room{width:21%;height:21%}
.room img,.core img{width:118%;height:118%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.7))}
.room .emo,.core .emo{font-size:min(7vw,3.6vh);opacity:.9}
.rname{position:absolute;bottom:-14%;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:Orbitron;font-weight:700;font-size:min(2.1vw,1.05vh);letter-spacing:.5px;
  padding:2px 5px;border-radius:6px;background:rgba(0,0,0,.75);color:color-mix(in srgb,var(--rc) 60%,#fff);border:1px solid color-mix(in srgb,var(--rc) 50%,transparent);pointer-events:none}
.core{left:50%;top:50%;width:25%;height:25%;border-radius:50%;--rc:#ff3b5c;animation:corePulse 3s ease-in-out infinite}
@keyframes corePulse{50%{box-shadow:0 0 30px rgba(255,59,92,.6),inset 0 0 20px rgba(255,59,92,.3)}}
.room.reach,.core.reach{cursor:pointer;animation:reach 1s ease-in-out infinite;z-index:3}
@keyframes reach{0%,100%{box-shadow:0 0 10px #fff,0 0 22px var(--lucas);transform:translate(-50%,-50%) scale(1)}50%{box-shadow:0 0 20px #fff,0 0 40px var(--lucas);transform:translate(-50%,-50%) scale(1.07)}}
.room.here{border-color:#fff}
.room.flash{animation:flash 1.2s 2}
@keyframes flash{50%{box-shadow:0 0 40px #fff,0 0 70px var(--rc)}}
.tok{position:absolute;width:8.5%;aspect-ratio:1;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.5,-.3,.3,1.3),top .9s cubic-bezier(.5,-.3,.3,1.3);z-index:5;pointer-events:none}
.tok .disc{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 40%,#000 120%);border:2px solid #fff;box-shadow:0 0 10px var(--c),0 3px 6px rgba(0,0,0,.8)}
.tok img,.tok .emo{position:absolute;left:-12%;top:-30%;width:124%;height:124%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.9))}
.tok.npc{opacity:.55;width:7%}
.tok.cur{z-index:6}
.tok.cur .disc{animation:curT 1s infinite}
@keyframes curT{50%{box-shadow:0 0 22px var(--c),0 0 40px var(--c)}}
.tok.dead{filter:grayscale(1);opacity:.5}
.wtok{position:absolute;width:5.2%;aspect-ratio:1;transform:translate(-50%,-50%);transition:left .9s,top .9s;z-index:4;pointer-events:none;
  display:flex;align-items:center;justify-content:center;border-radius:30%;background:rgba(0,0,0,.6);border:1px solid rgba(255,180,60,.6)}
.wtok img{width:130%;height:130%;object-fit:contain}
.wtok .emo{font-size:min(3vw,1.5vh)}

.panel{padding:8px 2px;display:flex;flex-direction:column;gap:9px;justify-content:center;min-height:0;overflow:auto}
.ptxt{text-align:center;font-size:17px;line-height:1.3;color:#cfe3ff}
.ptxt b{color:#fff}
.diceMini{display:inline-flex;width:30px;height:30px;border-radius:8px;background:#fff;color:#000;font-family:Orbitron;font-weight:900;align-items:center;justify-content:center;margin:0 4px;box-shadow:0 0 10px var(--neon)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:700;font-size:13px}
.tabs button.on{background:rgba(34,228,255,.18);border-color:var(--neon)}
.drawer{position:fixed;left:0;right:0;bottom:0;max-height:78vh;z-index:40;padding:14px 12px max(14px,env(safe-area-inset-bottom));
  border-radius:24px 24px 0 0;background:rgba(8,12,28,.96);border-top:1px solid var(--neon);box-shadow:0 -10px 40px rgba(0,0,0,.6);
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);overflow:auto}
.drawer.open{transform:none}
.drawer .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.drawer .hd b{font-family:Orbitron;letter-spacing:2px}

/* cartas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.kcard{position:relative;aspect-ratio:2/3;border-radius:12px;padding:4px;background:linear-gradient(145deg,var(--c),#111 60%,var(--c));box-shadow:0 0 14px color-mix(in srgb,var(--c) 55%,transparent),0 6px 14px rgba(0,0,0,.6);overflow:hidden;animation:dealIn .5s both}
.kcard .in{position:relative;height:100%;border-radius:9px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c) 40%,#0b1020),#05070f 80%);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.kcard .tp{font-family:Orbitron;font-size:7.5px;letter-spacing:2px;color:var(--c);margin-top:5px;text-transform:uppercase}
.kcard .art{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.kcard .art img{width:96%;height:96%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.8))}
.kcard .art .emo{font-size:40px}
.kcard .nm{width:100%;text-align:center;font-family:Orbitron;font-weight:700;font-size:9px;padding:5px 3px 6px;background:rgba(0,0,0,.6);border-top:1px solid color-mix(in srgb,var(--c) 60%,transparent);line-height:1.15}
.kcard .holo{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,rgba(120,255,255,.15) 50%,transparent 62%);background-size:250% 100%;animation:holo 3.8s linear infinite;mix-blend-mode:screen;pointer-events:none}
.kcard.sel{outline:3px solid #fff;box-shadow:0 0 26px #fff,0 0 40px var(--c);transform:translateY(-4px)}
.kcard.dim{opacity:.35;filter:grayscale(.8)}
.kcard.lg{width:min(42vw,220px)}
.kcard.lg .nm{font-size:13px}.kcard.lg .tp{font-size:10px}.kcard.lg .art .emo{font-size:80px}
@keyframes holo{0%{background-position:150% 0}100%{background-position:-100% 0}}
@keyframes dealIn{from{transform:translateY(30px) rotate(-8deg) scale(.8);opacity:0}}
.back{background:linear-gradient(145deg,#2c3a55,#0b0f1d)}
.back{padding:0;background:url(img/dorso.png) center/100% 100% no-repeat,#0b1430}
.back .in{background:none}

/* libreta */
.nsec{margin-bottom:12px}
.nrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.03);margin-bottom:4px}
.nrow img,.nrow .emo{width:30px;height:30px;object-fit:contain;font-size:20px}
.nrow .n{flex:1;font-weight:700}
.nrow .bd{font-family:Orbitron;font-size:9px;letter-spacing:1px;padding:3px 6px;border-radius:6px}
.bd.mia{background:rgba(23,255,95,.2);color:var(--lucas)}
.bd.vis{background:rgba(34,228,255,.2);color:var(--neon)}
.mk{width:40px;height:32px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:17px;font-weight:900}
.nrow.cross .n{text-decoration:line-through;opacity:.45}

/* log */
.logL{display:flex;flex-direction:column;gap:6px}
.logL div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:15px;line-height:1.3;border-left:3px solid var(--neon)}

/* ── overlays ── */
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;
  background:radial-gradient(circle,rgba(10,20,50,.86),rgba(0,0,0,.94));pointer-events:auto;animation:ovIn .35s both}
.ov.out{animation:ovOut .35s both}
@keyframes ovIn{from{opacity:0;backdrop-filter:blur(0)}to{opacity:1}}
@keyframes ovOut{to{opacity:0}}
.ov h1{font-family:Orbitron;font-weight:900;margin:0;font-size:clamp(28px,8vw,64px);letter-spacing:3px;color:#fff;text-shadow:0 0 14px var(--oc,var(--neon)),0 0 40px var(--oc,var(--neon));animation:zoomIn .6s cubic-bezier(.2,1.5,.4,1) both}
.ov p{margin:0;font-size:clamp(17px,4.6vw,30px);max-width:820px;line-height:1.3}
.ov p b{color:var(--oc,var(--neon))}

const AU = {ctx:null, on: (localStorage.getItem('kb_snd') !== '0')};
function ac(){ if(!AU.ctx){ try{ AU.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AU.ctx&&AU.ctx.state==='suspended') AU.ctx.resume(); return AU.ctx; }
function tone(f, d, type='sine', v=.12, f2=null, delay=0){
  if(!AU.on) return; const c = ac(); if(!c) return;
  const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d, v=.15, delay=0){
  if(!AU.on) return; const c = ac(); if(!c) return;
  const b = c.createBuffer(1, c.sampleRate*d, c.sampleRate), a = b.getChannelData(0);
  for (let i=0;i<a.length;i++) a[i] = (Math.random()*2-1)*(1-i/a.length);
  const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
  f.type='bandpass'; f.frequency.value=1800; s.buffer=b; g.gain.value=v;
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(c.currentTime+delay);
}

/* ═════════════ MÚSICA DE FONDO (Web Audio, sin MP3) ═════════════ */
const MUS = (()=>{
  let on=false, timer=null, step=0, nextT=0, master=null, comp=null;
  const BPM=96, S16=60/BPM/4;
  // Progresión misteriosa en La menor: Am - F - Dm - E
  const CH=[[57,60,64],[53,57,60],[50,53,57],[52,56,59]];
  const BASS=[45,41,38,40];
  const ARP=[0,1,2,1,0,2,1,2, 0,1,2,1,0,2,1,0];
  const LEAD=[76,null,74,72,null,71,72,null, 69,null,null,71,72,null,74,null, 76,null,77,76,null,74,72,null, 71,null,72,null,68,null,null,null];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    const c=ac(); if(!c) return null;
    if(!master){ comp=c.createDynamicsCompressor(); master=c.createGain(); master.gain.value=0; master.connect(comp); comp.connect(c.destination); }
    return c;
  }
  function osc(c,type,f,t,d,v,cut,det){
    const o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter();
    o.type=type; o.frequency.setValueAtTime(f,t); if(det) o.detune.value=det;
    fl.type='lowpass'; fl.frequency.setValueAtTime(cut||3000,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+Math.min(.02,d/4)); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
  }
  function pad(c,notes,t,d){
    notes.forEach(n=>[-8,8].forEach(det=>{
      const o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter();
      o.type='sawtooth'; o.frequency.value=hz(n); o.detune.value=det; fl.type='lowpass'; fl.frequency.value=900;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(.022,t+d*.35); g.gain.linearRampToValueAtTime(0.0001,t+d);
      o.connect(fl); fl.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
    }));
  }
  function kick(c,t){ const o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.15);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.25); o.connect(g); g.connect(master); o.start(t); o.stop(t+.3); }
  function hat(c,t,v){ const b=c.createBuffer(1,c.sampleRate*.05,c.sampleRate), a=b.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*(1-i/a.length);
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); f.type='highpass'; f.frequency.value=7000; g.gain.value=v; s.buffer=b; s.connect(f); f.connect(g); g.connect(master); s.start(t); }
  function sched(){
    const c=ac(); if(!c) return;
    while(nextT < c.currentTime+0.25){
      const bar=Math.floor(step/16)%4, s=step%16, sec=Math.floor(step/64)%4, t=nextT, ch=CH[bar];
      if(s===0) pad(c,ch,t,S16*16);
      if(s%4===0||s===10) osc(c,'sawtooth',hz(BASS[bar]),t,S16*1.8,.16,420);
      if(sec>0) osc(c,'square',hz(ch[ARP[s]]+12),t,S16*.9,.035,2200);
      if(sec>0 && (s===0||s===8)) kick(c,t);
      if(sec>0 && s%2===1) hat(c,t,s%4===3?.05:.025);
      if(sec>=2){ const ln=LEAD[(Math.floor(step/2))%32]; if(step%2===0 && ln) osc(c,'triangle',hz(ln),t,S16*3,.06,4000,4); }
      nextT+=S16; step++;
    }
  }
  function start(){ const c=init(); if(!c||on) return; on=true; step=0; nextT=c.currentTime+.1;
    master.gain.cancelScheduledValues(c.currentTime); master.gain.setValueAtTime(master.gain.value,c.currentTime); master.gain.linearRampToValueAtTime(.55,c.currentTime+2);
    timer=setInterval(sched,60); sched(); }
  function stop(){ if(!on) return; on=false; clearInterval(timer); const c=ac(); if(c&&master){ master.gain.cancelScheduledValues(c.currentTime); master.gain.setValueAtTime(master.gain.value,c.currentTime); master.gain.linearRampToValueAtTime(0,c.currentTime+.8); } }
  return { start, stop, get on(){ return on; } };
})();

(function(){
  const cv = document.getElementById('stars'), x = cv.getContext('2d'); let W,H,st=[],sh=null;
  function rs(){ W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
    st=Array.from({length:Math.min(260,Math.floor(W*H/9000))},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*1+.2,p:Math.random()*6})); }
  addEventListener('resize', rs); rs();
  function fr(t){
    x.clearRect(0,0,W,H);
    for (const s of st){ s.y += s.z*.35*devicePixelRatio; if (s.y>H){s.y=0;s.x=Math.random()*W;}
      const a = .35+.65*Math.abs(Math.sin(t/900+s.p)); x.fillStyle=`rgba(${200+s.z*50|0},${220+s.z*30|0},255,${a*s.z})`;
      x.fillRect(s.x,s.y,s.z*2*devicePixelRatio,s.z*2*devicePixelRatio); }
    if (!sh && Math.random()<.004) sh={x:Math.random()*W,y:Math.random()*H*.5,l:0};
    if (sh){ sh.l+=18*devicePixelRatio; const g=x.createLinearGradient(sh.x,sh.y,sh.x-sh.l*.7,sh.y-sh.l*.35);
      g.addColorStop(0,'rgba(255,255,255,.9)'); g.addColorStop(1,'rgba(34,228,255,0)'); x.strokeStyle=g; x.lineWidth=2*devicePixelRatio;
      x.beginPath(); x.moveTo(sh.x+sh.l,sh.y+sh.l*.5); x.lineTo(sh.x+sh.l*.3,sh.y+sh.l*.15); x.stroke(); if (sh.l>W*.5) sh=null; }
    requestAnimationFrame(fr);
  }
  requestAnimationFrame(fr);
})();

let pollT=null, polling=false;
function startPoll(){ stopPoll(); pollT=setInterval(poll, 1100); poll(); }
function stopPoll(){ if(pollT) clearInterval(pollT); pollT=null; }
async function poll(){
  if (polling || !S.code) return; polling=true;
  try{ const g = await api('estado', {code:S.code, tk:S.token, ver:S.ver}); onState(g); }
  catch(e){} finally{ polling=false; }
}
function enterRoom(){ S.ver=0; S.g=null; S.lastEv=null; S.endShown=false; S.screen=''; loading('Conectando…'); startPoll(); }

function onState(g){
  if (!g || g.ok===false) return;
  if (g.gone){ toast('La partida ya no existe',1); clearSess(); S.code=null; return showMenu(); }
  if (g.same) return;
  const prev = S.g; S.g = g; S.ver = g.ver; setTimeout(musSync,0);
  if (g.me) S.pid = g.me;
  if (g.status==='lobby'){
    if (S.screen!=='lobby') S.endShown=false;
    S.lastEv = g.evn; renderLobby(); return;
  }
  if (S.screen!=='game'){ buildGame(); }
  handleEvents(g);
  updateGame(prev);
}

function amHost(){ return S.g && S.g.isHost; }
function meP(){ return S.g && S.g.players.find(p=>p.id===S.g.me); }

function drawQR(el, text, size){
  try{ const q=qrcode(0,'M'); q.addData(text); q.make(); const cell=Math.max(2,Math.ceil(size/q.getModuleCount()));
    el.innerHTML=`<img src="${q.createDataURL(cell,0)}" width="${size}" height="${size}" style="image-rendering:pixelated" alt="QR">`; }
  catch(e){ el.innerHTML = `<div style="width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:700">${esc(text)}</div>`; }
}

}

function roomXY(i){ const a = (-90 + i*40) * Math.PI/180; return {x:50+38*Math.cos(a), y:50+38*Math.sin(a)}; }
function locXY(loc){ if (loc==='nucleo') return {x:50,y:50}; const i=ROOMS.findIndex(r=>r.id===loc); return roomXY(i<0?0:i); }

function buildBoard(el){
  const teleCols = ['#ff3bd4','#ffd23f','#17ff5f'];
  let svg = `<svg class="lines" viewBox="0 0 100 100"><circle class="ringL" cx="50" cy="50" r="38"/>`;
  ROOMS.forEach((r,i)=>{ const p=roomXY(i); svg+=`<line class="spoke" x1="50" y1="50" x2="${p.x}" y2="${p.y}"/>`; });
  TELE.forEach((t,k)=>{ const a=roomXY(t[0]), b=roomXY(t[1]); const mx=(a.x+b.x)/2, my=(a.y+b.y)/2; const cx=50+(mx-50)*.25, cy=50+(my-50)*.25;
    svg+=`<path class="tele" d="M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}" stroke="${teleCols[k]}" style="filter:drop-shadow(0 0 1px ${teleCols[k]})"/>`; });
  svg += `</svg>`;
  let h = svg + `<div class="core" data-room="nucleo">${pimg('sala_nucleo','🔴')}<div class="rname" style="bottom:-9%">Núcleo</div></div>`;
  ROOMS.forEach((r,i)=>{ const p=roomXY(i); h+=`<div class="room" data-room="${r.id}" style="left:${p.x}%;top:${p.y}%;--rc:${r.c}">${art(r.id)}<div class="rname">${r.n}</div></div>`; });
  SUS.forEach(s=>{ h+=`<div class="tok" id="tok_${s.id}" style="--c:${s.c};left:50%;top:50%"><i class="disc"></i>${art(s.id)}</div>`; });
  WEA.forEach(w=>{ h+=`<div class="wtok" id="wt_${w.id}" style="left:50%;top:50%">${art(w.id)}</div>`; });
  el.innerHTML = h;
  el.onclick = e=>{ const r=e.target.closest('[data-room]'); if (r && r.classList.contains('reach')){ SFX.whoosh(); act('mover',{room:r.dataset.room}); } };
}

function updateBoard(){
  const g=S.g, el=$('#board'); if(!el) return;
  const played = {}; g.players.forEach(p=>played[p.sus]=p);
  const cur = g.players[g.turn];
  const groups = {};
  SUS.forEach(s=>{ const l=g.pos[s.id]||'nucleo'; (groups[l]=groups[l]||[]).push(s.id); });
  Object.keys(groups).forEach(l=>{
    const c=locXY(l), arr=groups[l], n=arr.length, r = l==='nucleo' ? (n>1?7:0) : (n>1?(n>3?6:5):0);
    arr.forEach((id,k)=>{ const a=(k/n)*Math.PI*2 - Math.PI/2; const t=$('#tok_'+id); if(!t) return;
      t.style.left=(c.x+r*Math.cos(a))+'%'; t.style.top=(c.y+r*Math.sin(a)-1)+'%';
      const p=played[id]; t.className='tok'+(p?'':' npc')+(p&&cur&&cur.id===p.id?' cur':'')+(p&&!p.alive?' dead':''); });
  });
  const wg = {};
  WEA.forEach(w=>{ const l=g.wpos[w.id]; (wg[l]=wg[l]||[]).push(w.id); });
  Object.keys(wg).forEach(l=>{ const c=locXY(l), arr=wg[l];
    arr.forEach((id,k)=>{ const t=$('#wt_'+id); if(!t) return; t.style.left=(c.x+7.5)+'%'; t.style.top=(c.y-6+k*5)+'%'; }); });
  const mine = cur && cur.id===g.me && g.phase==='mover';
  const here = cur ? g.pos[cur.sus] : null;
  el.classList.toggle('choosing', !!mine);
  el.querySelectorAll('[data-room]').forEach(r=>{
    r.classList.toggle('reach', !!(mine && g.reach.includes(r.dataset.room)));
    r.classList.toggle('here', r.dataset.room===here);
  });
}

function flashRoom(id){ const r=document.querySelector(`#board [data-room="${id}"]`); if(!r) return; r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash'); clearTimeout(r._ft); r._ft=setTimeout(()=>r.classList.remove('flash'),2500); }

function phaseText(g, p){
  const cur=g.players[g.turn]; const n=esc(cur.name);
  if (g.phase==='tirar') return `${n} va a tirar los propulsores`;
  if (g.phase==='mover') return `${n} sacó ${g.dice} y está eligiendo sala`;
  if (g.phase==='sospechar') return `${n} está pensando una sospecha…`;
  if (g.phase==='refutar'){ const r=g.players.find(x=>x.id===g.sug.refuter); return `Esperando a que ${esc(r?r.name:'')} enseñe una carta`; }
  if (g.phase==='accion') return `${n} está decidiendo…`;
  return '';
}

function updateGame(prev){
  const g=S.g; if (S.screen!=='game') return;
  const cur=g.players[g.turn]; const cs=ALL[cur.sus];
  const tb=$('#turnB');
  if (g.status==='ended'){
    const w=g.players.find(p=>p.id===g.winner);
    tb.style.setProperty('--c', w?ALL[w.sus].c:'#888');
    tb.innerHTML = `${w?art(w.sus):''}<div style="min-width:0"><b>🏆 ${w?esc(w.name):'Sin ganador'}</b><small>Caso cerrado</small></div>`;
  } else {
    tb.style.setProperty('--c', cs.c);
    tb.innerHTML = `${art(cur.sus)}<div style="min-width:0"><b>${cur.id===g.me?'¡TU TURNO!':'Turno de '+esc(cur.name)}</b><small>${phaseText(g)}</small></div>`;
  }
  updateBoard();
  if (isTV()) updateTvSide(); else { renderPanel(); if (S.tab) openTab(S.tab, true); }
  // ¿me toca?
  const key = g.turn+'_'+(g.evn);
  if (g.status==='playing' && cur.id===g.me && g.phase==='tirar' && S.myTurnSeen!==g.turn+':'+g.ver && (!prev || prev.turn!==g.turn || prev.status!=='playing')){
    S.myTurnSeen=g.turn+':'+g.ver; SFX.turn(); vib([80,60,80]); toast('🎯 ¡Te toca! Tira los propulsores');
  }
  // ¿me toca enseñar carta?
  if (g.phase==='refutar' && g.sug && g.sug.refuter===g.me && g.sug.options){
    const k = g.sug.by+g.sug.sus+g.sug.wea+g.sug.room+g.evn;
    if (S.refKey!==k && !evBusy && !evQ.length){ S.refKey=k; showRefute(); }
  } else if (S.refKey && $('#modal') && $('#modal').dataset.ref){ closeModal(); S.refKey=null; }
  if (g.status==='ended' && !S.endShown && !evBusy && !evQ.length){ S.endShown=true; showEnd(); }
}

function renderPanel(){
  const g=S.g, pn=$('#panel'); if(!pn) return;
  const me=meP(), cur=g.players[g.turn], my = cur.id===g.me;
  let h='';
  if (g.status==='ended'){
    h = `<button class="btn gold big" onclick="showEnd()">🏆 Ver la solución</button>`;
  } else if (me && !me.alive){
    h = `<div class="ptxt">💀 Has sido eliminado.<br><small>Sigues enseñando cartas cuando te pregunten.</small></div><button class="btn ghost" onclick="showSol()">👁️ Ver el sobre secreto</button>`;
  } else if (!my){
    h = `<div class="ptxt">${phaseText(g)}</div>`;
    if (g.sug && g.sug.result && g.phase!=='refutar') h += sugMini();
  } else if (g.phase==='tirar'){
    h = `<button class="btn big green" id="bRoll">🎲 Tirar propulsores</button>`;
    if (me.summoned && g.pos[me.sus]!=='nucleo') h += `<button class="btn" id="bStay">📍 Quedarme en ${NM(g.pos[me.sus])} y sospechar</button>`;
    h += `<button class="btn red" id="bAcc">⚖️ Acusar</button>`;
  } else if (g.phase==='mover'){
    h = `<div class="ptxt">Sacaste <span class="diceMini">${g.dice}</span> → avanza hasta <b>${PASOS[g.dice]} sala${PASOS[g.dice]>1?'s':''}</b>.<br>Toca una sala <b style="color:var(--lucas)">iluminada</b> del mapa.</div><button class="btn red sm" style="align-self:center" id="bAcc">⚖️ Acusar</button>`;
  } else if (g.phase==='sospechar'){
    h = `<div class="ptxt">Estás en <b>${NM(g.pos[me.sus])}</b></div><button class="btn big" id="bSus">🔍 Lanzar sospecha</button><div class="row"><button class="btn ghost" id="bSkip">Saltar</button><button class="btn red" id="bAcc">⚖️ Acusar</button></div>`;
  } else if (g.phase==='refutar'){
    h = `<div class="ptxt">${phaseText(g)}</div>`;
  } else if (g.phase==='accion'){
    h = sugMini() + `<div class="row"><button class="btn red" id="bAcc">⚖️ Acusar</button><button class="btn green" id="bEnd">✅ Terminar turno</button></div>`;
  }
  pn.innerHTML = h;
  const on=(id,f)=>{ const b=$(id); if(b) b.onclick=f; };
  on('#bRoll', ()=>{ SFX.click(); act('tirar'); });
  on('#bStay', ()=>{ SFX.click(); act('quedarse'); });
  on('#bAcc',  ()=>{ SFX.click(); pickTrio(true); });
  on('#bSus',  ()=>{ SFX.click(); pickTrio(false); });
  on('#bSkip', ()=>{ SFX.click(); act('saltar'); });
  on('#bEnd',  ()=>{ SFX.click(); act('fin'); });
}

function sugMini(){
  const g=S.g, s=g.sug; if(!s||!s.result) return '';
  const by=g.players.find(p=>p.id===s.by), rf=g.players.find(p=>p.id===s.refuter);
  let r = s.result==='nadie' ? '😱 Nadie pudo desmentirlo' : s.result==='visto' ? `🛡️ ${esc(rf?rf.name:'')} enseñó una carta${s.shown?': <b>'+NM(s.shown)+'</b>':''}` : '';
  return `<div class="ptxt" style="font-size:15px"><b>${esc(by?by.name:'')}</b>: ${NM(s.sus)} · ${NM(s.wea)} · ${NM(s.room)}<br>${r}</div>`;
}

let busyAct=false;
async function act(type, data){
  if (busyAct) return; busyAct=true;
  const aid = Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  try{ onState(await G('jugar', {act:type, d:data||{}, aid})); }
  catch(e){ toast(errMsg(e),1); }
  finally{ busyAct=false; }
}

function pickTrio(accuse){
  const g=S.g, me=meP(); const sel={sus:null,wea:null,room: accuse?null:g.pos[me.sus]};
  const sec=(title,list,key)=>`<div class="lbl">${title}</div><div class="pick" data-k="${key}">${list.map(x=>cardHTML(x.id)).join('')}</div>`;
  const m = modal(`<h2 class="t" style="${accuse?'background:linear-gradient(90deg,#fff,var(--red));-webkit-background-clip:text;background-clip:text':''}">${accuse?'⚖️ Acusación final':'🔍 Sospecha'}</h2>
    ${accuse?'<div class="ptxt" style="margin-bottom:10px">Si fallas, quedas <b style="color:var(--red)">ELIMINADO</b>.</div>':`<div class="ptxt" style="margin-bottom:10px">En <b>${NM(sel.room)}</b>. ¿Quién fue y con qué?</div>`}
    ${sec('¿Quién?',SUS,'sus')}${sec('¿Con qué?',WEA,'wea')}${accuse?sec('¿Dónde?',ROOMS,'room'):''}
    <button class="btn big ${accuse?'red':'green'}" id="bConf" disabled>${accuse?'⚖️ ACUSAR':'🔍 Sospechar'}</button>
    <button class="btn ghost" onclick="closeModal()" style="margin-top:8px">Cancelar</button>`);
  const mine = new Set((g.hand||[]).concat(g.seen||[]));
  m.querySelectorAll('.pick .kcard').forEach(c=>{ if (mine.has(c.dataset.id)) c.style.opacity='.55';
    c.onclick=()=>{ SFX.click(); const k=c.parentElement.dataset.k; sel[k]=c.dataset.id;
      c.parentElement.querySelectorAll('.kcard').forEach(x=>x.classList.toggle('sel',x===c));
      $('#bConf').disabled = !(sel.sus&&sel.wea&&sel.room); }; });
  $('#bConf').onclick=()=>{ closeModal(); act(accuse?'acusar':'sospechar', sel); };
}

function showRefute(){
  const g=S.g, s=g.sug, by=g.players.find(p=>p.id===s.by);
  const m = modal(`<h2 class="t">🛡️ Enseña una carta</h2><div class="ptxt" style="margin-bottom:12px"><b>${esc(by.name)}</b> sospecha de <b>${NM(s.sus)}</b> con <b>${NM(s.wea)}</b> en <b>${NM(s.room)}</b>.<br>Tienes varias, elige cuál le enseñas:</div>
    <div class="pick" style="grid-template-columns:repeat(${s.options.length},1fr)">${s.options.map(c=>cardHTML(c)).join('')}</div>`);
  m.dataset.lock=1; m.dataset.ref=1; vib([200,100,200]); SFX.alarm();
  m.querySelectorAll('.kcard').forEach(c=>c.onclick=()=>{ SFX.reveal(); closeModal(); act('refutar',{card:c.dataset.id}); });
}

/* drawer */
function openTab(t, refresh){
  const d=$('#drawer'); if(!d) return; S.tab=t;
  app.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  if (!t){ d.classList.remove('open'); return; }
  const g=S.g; let h='';

let evQ=[], evBusy=false;
function handleEvents(g){
  if (S.lastEv==null){ S.lastEv=g.evn; g.ev.filter(e=>e.type==='inicio' && g.now-e.t<10000).forEach(e=>evQ.push(e)); playNext(); return; }
  g.ev.filter(e=>e.n>S.lastEv).forEach(e=>evQ.push(e));
  S.lastEv = g.evn;
  while (evQ.length>4) evQ.shift();
  playNext();
}
function playNext(){
  if (evBusy || !evQ.length) return;
  const e = evQ.shift(); evBusy = true;
  const d = showEv(e);
  setTimeout(()=>{ hideOv(); evBusy=false; playNext(); if(!evQ.length && S.g) updateGame(S.g); }, d);
}

function holdBtn(el, ms, onHold, onClick, bar){
  let t=null, start=0, raf=0, fired=false;
  const prog = ()=>{ if(!bar) return; const p=Math.min(1,(Date.now()-start)/ms); el.style.setProperty('--hold', (p*100)+'%'); if(p<1) raf=requestAnimationFrame(prog); };
  const down = e=>{ fired=false; start=Date.now(); t=setTimeout(()=>{ fired=true; vib(60); el.style.setProperty('--hold','0%'); onHold(); }, ms); if(bar){ el.classList.add('holding'); prog(); } };
  const up = ()=>{ clearTimeout(t); cancelAnimationFrame(raf); el.classList.remove('holding'); el.style.setProperty('--hold','0%'); };
  el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up); el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', e=>e.preventDefault());
  el.addEventListener('click', e=>{ if(fired){ e.preventDefault(); e.stopPropagation(); fired=false; return; } onClick && onClick(e); });
}

const Admin = (()=>{

  function pararNfc(){ if(nfcCtrl){ try{ nfcCtrl.abort(); }catch(e){} nfcCtrl=null; } nfcBusy=false; }
  /* Lector continuo: arranca solo al abrir; mientras está activo Chrome se queda la llave
     y Android NO ejecuta lo que lleva grabado (enlace, etc.). Solo usamos el número de serie. */
  async function escuchar(onSerial, txt){
    pararNfc();
    const t = txt || (()=>{});
    try{
      nfcCtrl = new AbortController();
      const r = new NDEFReader();
      await r.scan({signal:nfcCtrl.signal});
      t('📡 Esperando la llave… acércala a la parte de atrás del móvil');
      r.onreadingerror = ()=>{ if(!nfcBusy) t('No pude leer la llave. Vuelve a acercarla.'); };
      r.onreading = async ev=>{
        if (nfcBusy) return; nfcBusy=true; vib(80);
        const serial = String(ev.serialNumber||'').replace(/:/g,'');
        try{ await onSerial(serial); pararNfc(); }
        catch(e){ toast(errMsg(e),1); t('Vuelve a acercar la llave'); nfcBusy=false; }
      };
      return true;
    }catch(e){
      pararNfc();
      t('Toca el botón para activar el lector NFC');
      return false;
    }
  }

  function abrir(){
    SFX.click();
    if (ADM) return panel();
    clearInterval(qrT); pararNfc();
    const m = modal(`<div style="text-align:center">
      <div class="nfcAnim">${NFC_SVG}<i></i><i></i></div>
      <h2 class="t" style="margin-top:6px">Acceso restringido</h2>

    $('#aCerrar').onclick = ()=>{ clearInterval(qrT); pararNfc(); closeModal(); };
    if (hayNfc){
      const txt = t=>{ const e=$('#aTxt'); if(e) e.textContent=t; const b=$('#bNfc'); if(b) b.classList.toggle('hidden', !/Toca el botón/.test(t)); };
      const ok = async serial=>{ const r = await call('admLlave',{llave:serial, ses:USER&&USER.ses});
        if (r.nueva) toast('🔑 Llave registrada como llave de admin'); setAdm(r.adm); SFX.reveal(); panel(); };
      escuchar(ok, txt);
      $('#bNfc').onclick = ()=>escuchar(ok, txt);
    }
    else call('admQr').then(r=>{
      drawQR($('#aQr'), r.url, 180);
      qrT = setInterval(async()=>{ const s = await api('admQrEstado',{q:r.q});
        if (s.estado==='ok'){ clearInterval(qrT); setAdm(s.adm); SFX.reveal(); panel(); }
        else if (s.estado==='caducado'){ clearInterval(qrT); toast('El QR ha caducado',1); closeModal(); } }, 2000);
    }).catch(e=>toast(errMsg(e),1));
  }

  function autorizar(q){
    app.innerHTML = `<div class="screen"><div class="menu glass" style="padding:24px;text-align:center">
      <div class="nfcAnim">${NFC_SVG}<i></i><i></i></div><h2 class="t">Autorizar ordenador</h2>
      <div class="ptxt" id="aTxt">${hayNfc?'Activando lector…':'Este móvil no puede leer NFC. Usa un Android con Chrome.'}</div>
      ${hayNfc?'<button class="btn big green hidden" id="bNfc">🔑 Activar lector NFC</button>':''}
      <button class="btn ghost" onclick="history.replaceState(null,\'\',location.pathname);showMenu()">Cancelar</button></div></div>`;
    if (!hayNfc) return;
    const txt = t=>{ const e=$('#aTxt'); if(e) e.textContent=t; const b=$('#bNfc'); if(b) b.classList.toggle('hidden', !/Toca el botón/.test(t)); };
    const ok = async serial=>{ await call('admAutorizar',{q, llave:serial, ses:USER&&USER.ses});
      SFX.reveal(); $('#aTxt').innerHTML='✅ <b>Ordenador autorizado.</b> Ya puedes cerrar esto.'; };
    escuchar(ok, txt);
    $('#bNfc').onclick = ()=>escuchar(ok, txt);
  }

  async function adm(op, d){
    const r = await api('adm',{adm:ADM, op, d});
    if (!r.ok){ if (r.error==='ADMIN'){ ADM=null; try{sessionStorage.removeItem('kb_adm');}catch(e){} toast('La sesión de admin ha caducado',1); closeModal(); throw new Error('ADMIN'); } throw new Error(r.error); }
    return r;
  }

  async function panel(){
    closeModal();
    const m = modal(`<div id="admBox"><div style="text-align:center;padding:30px"><div class="spinner" style="margin:auto"></div></div></div>`);
    m.classList.add('adm');
    try{ D = await adm('resumen'); pinta(); }catch(e){ if(e.message!=='ADMIN') toast(errMsg(e),1); }
  }

  const fecha = f=>{ try{ return new Date(f).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
  function bars(obj){ const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...e.map(x=>x[1]));
    return e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/mx*100}%"></i><b>${v}</b></div>`).join('') || '<div class="mut">Aún no hay partidas</div>'; }

  function pinta(){
    const box = $('#admBox'); if(!box) return;
    const T = [['resumen','📊 Resumen'],['ajustes','⚙️ Ajustes'],['cartas','🃏 Cartas'],['usuarios','👥 Usuarios'],['seguridad','🔐 Seguridad']];
    let h = `<div class="admHd"><h2 class="t" style="margin:0">Panel de control</h2><button class="ib" onclick="closeModal()">✕</button></div>
      <div class="admTabs">${T.map(([k,n])=>`<button class="${pest===k?'on':''}" data-p="${k}">${n}</button>`).join('')}</div><div class="admBody">`;
    const a = D.ajustes;
    if (pest==='resumen'){
      h += `<div class="kpis"><div><b>${D.stats.total}</b><span>Partidas jugadas</span></div><div><b>${D.activas.length}</b><span>Salas abiertas</span></div><div><b>${D.usuarios.length}</b><span>Anfitriones</span></div></div>
        <div class="lbl">Salas abiertas ahora</div>
        ${D.activas.map(s=>`<div class="admRow"><div><b>${s.code}</b> · ${s.modo==='tv'?'📺 TV':'📱 Móviles'} · ${s.status==='lobby'?'en sala de espera':s.status==='playing'?'🎮 jugando':'terminada'}<br><small>${esc(s.host)} → ${s.jug.map(esc).join(', ')}</small></div><button class="btn red sm" data-cerrar="${s.code}">Cerrar</button></div>`).join('') || '<div class="mut">No hay salas abiertas</div>'}
        <div class="lbl">Asesino más repetido</div>${bars(D.stats.porSus)}
        <div class="lbl">Arma más usada</div>${bars(D.stats.porArma)}
        <div class="lbl">Últimas partidas</div>
        ${D.stats.ultimas.map(u=>`<div class="admRow"><div><b>🏆 ${esc(u.gana)}</b> · ${fecha(u.f)} · ${u.min} min<br><small>${esc(u.jug)}<br>🔎 ${esc(u.sol)}</small></div></div>`).join('') || '<div class="mut">—</div>'}`;
    }
    if (pest==='ajustes'){
      h += `<label class="fld">Segundos para enseñar carta<input class="inp l" id="aRef" type="number" min="10" max="180" value="${a.tRefutar}"></label>
        <label class="fld">Pausa de los bots (milisegundos)<input class="inp l" id="aBot" type="number" min="600" max="8000" step="100" value="${a.botMs}"></label>
        <label class="fld">Máximo de jugadores por sala<input class="inp l" id="aMax" type="number" min="2" max="9" value="${a.maxJug}"></label>
        <label class="chk"><input type="checkbox" id="aBots" ${a.bots?'checked':''}> Permitir añadir bots</label>
        <label class="fld">Aviso en el menú (vacío = sin aviso)<input class="inp l" id="aBan" maxlength="200" value="${esc(a.banner)}"></label>
        <label class="fld">Texto de la intro (alerta roja)<textarea class="inp l" id="aIntro" rows="3" maxlength="300">${esc(a.intro)}</textarea></label>
        <label class="chk"><input type="checkbox" id="aMant" ${a.mant?'checked':''}> 🚧 Modo mantenimiento (no se pueden crear partidas)</label>
        <label class="fld">Mensaje de mantenimiento<input class="inp l" id="aMantMsg" maxlength="200" value="${esc(a.mantMsg)}"></label>
        <button class="btn green" id="aSave">💾 Guardar ajustes</button>`;
    }
    if (pest==='cartas'){
      h += `<div class="ptxt" style="font-size:14px;margin-bottom:8px">Cambia el nombre, la descripción o el color de una carta, o pon la URL de una imagen nueva. Si actualizas los PNG en GitHub, pulsa <b>Recargar imágenes</b> para que se vean en todos los móviles.</div>
        <button class="btn gold" id="aImg">🔄 Recargar imágenes (versión ${a.imgVer})</button>
        ${[['Sospechosos',SUS],['Armas',WEA],['Salas',ROOMS]].map(([t,l])=>`<div class="lbl">${t}</div>`+l.map(x=>{ const o=D.cartas[x.id]||{};
          return `<div class="admCard" data-id="${x.id}"><div class="mini">${cardHTML(x.id)}</div><div class="f">
            <input class="inp l s" data-k="n" placeholder="${esc(BASE_NM[x.id])}" value="${esc(o.n||'')}">
            <input class="inp l s" data-k="d" placeholder="Descripción" value="${esc(o.d||'')}">
            <div class="row"><input class="inp l s" data-k="c" type="color" value="${o.c||x.c0||'#22e4ff'}" style="padding:2px;height:38px"><input class="inp l s" data-k="img" placeholder="URL imagen (opcional)" value="${esc(o.img||'')}"></div>
            <div class="row"><button class="btn sm green" data-save>Guardar</button><button class="btn sm ghost" data-reset>Original</button></div></div></div>`; }).join('')).join('')}`;
    }
    if (pest==='usuarios'){
      h += D.usuarios.map(u=>`<div class="admRow"><div><b>${esc(u.nombre)}</b> ${u.google?'<small>(Google)</small>':''}<br><small>${esc(u.email)} · ${u.partidas} partidas · ${fecha(u.ultimo)}</small></div>
        <button class="btn sm ${u.bloq?'green':'red'}" data-bloq="${esc(u.email)}" data-v="${u.bloq?0:1}">${u.bloq?'Desbloquear':'Bloquear'}</button></div>`).join('') || '<div class="mut">Aún no hay anfitriones registrados</div>';
    }
    if (pest==='seguridad'){
      h += `<div class="lbl">Llaves NFC</div><div class="ptxt" style="font-size:15px">${D.llaves} llave(s) registrada(s). La primera se registra sola al entrar con tu llave estando logueado con ${esc(CFG.ADMIN)}.</div>
        <button class="btn red sm" id="aLlaves">Borrar todas las llaves</button>
        <button class="btn ghost" style="margin-top:16px" id="aOut">🚪 Cerrar sesión de admin</button>`;
    }
    h += `</div>`;
    box.innerHTML = h;
    box.querySelectorAll('.admTabs button').forEach(b=>b.onclick=()=>{ pest=b.dataset.p; pinta(); });
    box.querySelectorAll('[data-cerrar]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Cerrar la sala '+b.dataset.cerrar+'?')) return; try{ await adm('cerrar',{code:b.dataset.cerrar}); D=await adm('resumen'); pinta(); toast('Sala cerrada'); }catch(e){} });
    const on=(id,f)=>{ const e=box.querySelector(id); if(e) e.onclick=f; };
    on('#aSave', async()=>{ try{ const r=await adm('ajustes',{tRefutar:$('#aRef').value, botMs:$('#aBot').value, maxJug:$('#aMax').value, bots:$('#aBots').checked, banner:$('#aBan').value, intro:$('#aIntro').value, mant:$('#aMant').checked, mantMsg:$('#aMantMsg').value});
      D.ajustes=r.ajustes; toast('✅ Ajustes guardados'); }catch(e){ if(e.message!=='ADMIN') toast(errMsg(e),1); } });
    on('#aImg', async()=>{ try{ const r=await adm('imgVer'); D.ajustes.imgVer=r.imgVer; toast('🔄 Imágenes actualizadas (versión '+r.imgVer+')'); pinta(); }catch(e){} });
    box.querySelectorAll('.admCard').forEach(c=>{
      const id=c.dataset.id;
      c.querySelector('[data-save]').onclick = async()=>{ const d={id}; c.querySelectorAll('[data-k]').forEach(i=>d[i.dataset.k]=i.value.trim());
        if (d.c && d.c.toLowerCase()===(ALL[id].c0||'').toLowerCase()) delete d.c;
        try{ const r=await adm('carta',d); D.cartas=r.cartas; aplicaCartas(r.cartas); toast('✅ Carta guardada'); pinta(); }catch(e){ if(e.message!=='ADMIN') toast(errMsg(e),1); } };
      c.querySelector('[data-reset]').onclick = async()=>{ try{ const r=await adm('carta',{id}); D.cartas=r.cartas; aplicaCartas(r.cartas); toast('Carta original'); pinta(); }catch(e){} };
    });
    box.querySelectorAll('[data-bloq]').forEach(b=>b.onclick=async()=>{ try{ await adm('bloquear',{email:b.dataset.bloq, bloq:b.dataset.v==='1'}); D=await adm('resumen'); pinta(); }catch(e){ if(e.message!=='ADMIN') toast(errMsg(e),1); } });
    on('#aLlaves', async()=>{ if(!confirm('¿Borrar todas las llaves? Tendrás que registrar la tuya otra vez.')) return; try{ await adm('llavesBorrar'); D.llaves=0; pinta(); }catch(e){} });
    on('#aTotpNx', async()=>{ try{ const r=await adm('totpNuevo'); D.totp=true; pinta();
      $('#totpBox').innerHTML=`<div class="ptxt" style="font-size:14px">Escanéalo con Google Authenticator:</div><div class="qr" id="tQr" style="margin:10px auto;width:max-content"></div><div class="ptxt" style="font-size:13px;word-break:break-all">Clave: <b>${r.secreto}</b></div>`;
      drawQR($('#tQr'), r.url, 170); }catch(e){} });
    on('#aTotpQ', async()=>{ try{ await adm('totpQuitar'); D.totp=false; pinta(); }catch(e){} });
    on('#aOut', ()=>{ ADM=null; try{sessionStorage.removeItem('kb_adm');}catch(e){} closeModal(); toast('Sesión de admin cerrada'); });
  }

  return { abrir, autorizar };
})();

/* ═════════════ AUTO-ACTUALIZACIÓN ═════════════ */
const APP_V = '13';
async function checkVersion(){
  try{
    const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
    const v = String((await r.json()).v);
    if (v && v !== APP_V){
      const o=document.createElement('div'); o.className='ov'; o.style.zIndex=99;
      o.innerHTML='<div class="spinner"></div><h1 style="font-size:28px">NUEVA VERSIÓN</h1><p>Actualizando la nave…</p>';
      document.body.appendChild(o);
      try{ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){}
      try{ if(S.code) sessionStorage.setItem('kb_upd','1'); }catch(e){}
      setTimeout(()=>location.reload(), 1200);
    }
  }catch(e){}
}
setInterval(checkVersion, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkVersion(); });
setTimeout(checkVersion, 4000);

/* ═════════════ ARRANQUE ═════════════ */
(async function init(){
  loading('Encendiendo motores…');
  const c = await api('config');
  if (c.ok){ PUB = c.cfg; IMGV = PUB.imgVer||1; aplicaCartas(PUB.cartas); }
  if (USER) api('yo',{ses:USER.ses}).then(r=>{ if(!r.ok && r.error==='SESION') logout(true); else if(r.ok){ USER.user=r.user; try{localStorage.setItem('kb_user',JSON.stringify(USER));}catch(e){} } });
  if (ADMQ) return Admin.autorizar(ADMQ);
  const s = loadSess();
  if (SALA0){
    if (s && s.code===SALA0){ Object.assign(S,{code:s.code,token:s.token,pid:s.pid,modo:s.modo}); return enterRoom(); }
    return showJoin(SALA0);
  }
  let upd=false; try{ upd=sessionStorage.getItem('kb_upd')==='1'; sessionStorage.removeItem('kb_upd'); }catch(e){}
  if (upd && s){ Object.assign(S,{code:s.code,token:s.token,pid:s.pid,modo:s.modo}); return enterRoom(); }
  if (MODO0==='tv') return create('tv','');
  showMenu();
})();
</script>
